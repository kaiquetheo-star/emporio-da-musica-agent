[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "1.0.0"
description = "AI customer-service agent for Empório da Música (Artefact technical challenge)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
